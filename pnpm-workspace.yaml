packages:
  - packages/*

# Every pinned version of the workspace's packages, each named `catalog:` in a package.json. A package adds its own
# entries with its first code: knip reports an entry no package uses.
catalog:
  # Cloudflare Workers: the runtime types and the workerd test pool.
  "@cloudflare/vitest-plugin": 1.8.1
  "@cloudflare/workers-types": 5.20261113.1

  # The Worker: routing, the Access JWT check, the webhook signature check, the schemas shared through @prq/protocol,
  # and request validation with them.
  "@hono/valibot-validator": 0.6.2
  "@octokit/webhooks-methods": 6.0.0
  hono: 4.13.18
  jose: 6.2.17
  valibot: 1.5.0

  # The Durable Objects: the Agents SDK (Hub), its chat agent (PrSession) and the AI SDK message types it stores.
  "@cloudflare/ai-chat": 0.12.2
  agents: 0.33.0
  ai: 7.0.172
  # The cloud agent's model: any provider with an OpenAI-compatible chat completions API.
  "@ai-sdk/openai-compatible": 3.0.92
  # The GitHub App: installation tokens (the App's JWT signed by auth-app's own signer), and the REST reads made with
  # them.
  "@octokit/auth-app": 8.3.1
  "@octokit/request": 10.0.16
  universal-github-app-jwt: 2.2.2

  # Tests and TypeScript; fast-check generates the interleavings of the head reconciliation's oracle test.
  fast-check: 4.10.2
  typescript: 7.0.2
  vitest: 5.1.0

  # The CLI: Node's types on the runtime's major line (mise.toml), so an API newer than Node 24 does not type-check;
  # and wrangler for its tests, which run the Worker through its test harness (the version the vitest plugin resolves).
  "@types/node": 24.19.2
  wrangler: 4.161.0

  # Lint, format, unused files, dependencies and exports (knip.jsonc), commit messages, and the Git hooks.
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  knip: 6.45.1
  # 2.2.2 was published without the provenance earlier releases carry; trustPolicy refuses it (.github/renovate.json).
  lefthook: 2.2.1
  oxfmt: 0.78.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007

# Dependency build scripts, each reviewed: none runs. esbuild, lefthook and workerd take their platform binaries from
# optionalDependencies; core-js-pure's postinstall only prints a funding message.
allowBuilds:
  core-js-pure: false
  esbuild: false
  lefthook: false
  workerd: false

# Fail installs when an unreviewed dependency build script appears.
strictDepBuilds: true

# Reject package versions published within the last 3 days (in minutes), matching mise.toml and the shared Renovate
# preset.
minimumReleaseAge: 4320

# Block git/tarball URL sources in transitive dependencies.
blockExoticSubdeps: true

# Detect package trust/provenance downgrades.
trustPolicy: no-downgrade
