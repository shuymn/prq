packages:
  - packages/*

# Every pinned version of the workspace's packages, each named `catalog:` in a package.json. A package adds its own
# entries with its first code: knip reports an entry no package uses.
catalog:
  # Cloudflare Workers: the runtime types and the workerd test pool.
  "@cloudflare/vitest-plugin": 1.8.1
  "@cloudflare/workers-types": 5.20261113.1

  # The Worker: routing, the Access JWT check, the webhook signature check, the schemas shared through @prq/protocol,
  # and request validation with them.
  "@hono/valibot-validator": 0.6.2
  "@octokit/webhooks-methods": 6.0.0
  hono: 4.13.18
  jose: 6.2.17
  valibot: 1.5.0

  # The Durable Objects: the Agents SDK (Hub), its chat agent (PrSession) and the AI SDK message types it stores.
  "@cloudflare/ai-chat": 0.12.2
  agents: 0.33.0
  ai: 7.0.172
  # The cloud agent's model: any provider with an OpenAI-compatible chat completions API.
  "@ai-sdk/openai-compatible": 3.0.92
  # The cloud agent's tools take valibot schemas as their input schemas; to-json-schema is the adapter's peer, which
  # turns them into the JSON Schema the provider is sent.
  "@ai-sdk/valibot": 3.0.81
  "@valibot/to-json-schema": 1.8.0
  # The GitHub App: installation tokens (the App's JWT signed by auth-app's own signer), and the REST reads made with
  # them.
  "@octokit/auth-app": 8.3.1
  "@octokit/request": 10.0.16
  universal-github-app-jwt: 2.2.2
  # Skill registration: a SKILL.md's frontmatter is YAML, read with aliases refused; and the confirm's blob reads, at
  # most six at a time (the Workers limit on simultaneous outgoing connections), the queued ones dropped at the first
  # failure.
  p-limit: 7.3.3
  yaml: 2.9.1
  # Skill scripts: the archive of a skill's files sent to the container's runner, a ustar whose 100-byte name field is
  # why a skill's paths are at most 100 bytes.
  nanotar: 0.3.0

  # The web UI (packages/server/src/client): React, built by Vite into Workers Static Assets; the design tokens turned
  # into CSS custom properties by Style Dictionary at build; Inter and JetBrains Mono self-hosted.
  "@fontsource/inter": 5.3.0
  "@fontsource/jetbrains-mono": 5.3.0
  # The icons the components show: GitHub's Octicons as React components.
  "@primer/octicons-react": 19.42.0
  # A pull request's conversation: the Agents SDK's chat hook (agents/chat/react) runs on the AI SDK's React binding,
  # the release built on the same ai version as the server; summaries and answers rendered from Markdown with GitHub's
  # extensions (tables, task lists, autolinks) and without raw HTML.
  "@ai-sdk/react": 4.0.176
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  # The AI SDK validates the chat's chunks with zod: the page turns on zod's jitless setting, so that zod never probes
  # for eval, which the page's Trusted Types policy blocks and reports.
  zod: 4.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  react: 19.3.1
  react-dom: 19.3.1
  style-dictionary: 5.8.0
  vite: 8.3.8
  # The machine's Chrome, driven for the UI's browser check and to render the favicon's rasters; no browser is
  # downloaded.
  playwright: 1.65.1

  # Tests and TypeScript; fast-check generates the interleavings of the head reconciliation's oracle test.
  fast-check: 4.10.2
  typescript: 7.0.2
  vitest: 5.1.0
  # The web UI's client tests: Vitest's browser mode in the machine's Chrome through playwright, and React rendered
  # into it.
  "@vitest/browser-playwright": 5.1.0
  vitest-browser-react: 2.3.0

  # Node's types on the runtime's major line (mise.toml), so an API newer than Node 24 does not type-check.
  "@types/node": 24.19.2
  # The CLI's test harness, which runs the Worker (the version the vitest plugin resolves), and the server's secrets
  # command, which puts the production secrets on the Worker.
  wrangler: 4.161.0
  # What the deploy refuses to run in: an environment wrangler takes as CI, by the ci-info it bundles (this version).
  ci-info: 4.4.0

  # Lint, format, unused files, dependencies and exports (knip.jsonc), commit messages, and the Git hooks.
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  knip: 6.45.1
  # 2.2.2 was published without the provenance earlier releases carry; trustPolicy refuses it (.github/renovate.json).
  lefthook: 2.2.1
  oxfmt: 0.78.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007
  # The UI's stylesheets: raw colors, sizes and fonts refused in favour of the design tokens (stylelint.config.mjs).
  stylelint: 18.0.0

# Dependency build scripts, each reviewed: none runs. esbuild, lefthook and workerd take their platform binaries from
# optionalDependencies; core-js-pure's postinstall only prints a funding message.
allowBuilds:
  core-js-pure: false
  esbuild: false
  lefthook: false
  workerd: false

# Fail installs when an unreviewed dependency build script appears.
strictDepBuilds: true

# Reject package versions published within the last 3 days (in minutes), matching mise.toml and the shared Renovate
# preset.
minimumReleaseAge: 4320

# Block git/tarball URL sources in transitive dependencies.
blockExoticSubdeps: true

# Detect package trust/provenance downgrades.
trustPolicy: no-downgrade
