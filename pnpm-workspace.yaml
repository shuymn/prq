packages:
  - packages/*

# Every pinned version of the workspace's packages, each named `catalog:` in a package.json. A package adds its own
# entries with its first code: knip reports an entry no package uses.
catalog:
  # Cloudflare Workers: the runtime types and the workerd test pool.
  "@cloudflare/vitest-plugin": 1.8.1
  "@cloudflare/workers-types": 5.20261113.1

  # The Worker: routing, the Access JWT check, and the schemas shared through @prq/protocol.
  hono: 4.13.18
  jose: 6.2.17
  valibot: 1.5.0

  # Tests and TypeScript.
  typescript: 7.0.2
  vitest: 5.1.0

  # Lint, format, unused files, dependencies and exports (knip.jsonc), commit messages, and the Git hooks.
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  knip: 6.45.1
  # 2.2.2 was published without the provenance earlier releases carry; trustPolicy refuses it (.github/renovate.json).
  lefthook: 2.2.1
  oxfmt: 0.78.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007

# Dependency build scripts, each reviewed: none runs, since every one of these packages takes its platform binary from
# optionalDependencies.
allowBuilds:
  esbuild: false
  lefthook: false
  workerd: false

# Fail installs when an unreviewed dependency build script appears.
strictDepBuilds: true

# Reject package versions published within the last 3 days (in minutes), matching mise.toml and the shared Renovate
# preset.
minimumReleaseAge: 4320

# Block git/tarball URL sources in transitive dependencies.
blockExoticSubdeps: true

# Detect package trust/provenance downgrades.
trustPolicy: no-downgrade
