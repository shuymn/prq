name: Security checks
# Scans the whole history for secrets with betterleaks; the pre-commit hook scans only the staged change
# (lefthook.yml).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  security:
    permissions:
      contents: read
    uses: shuymn/github-actions/.github/workflows/security.yml@d9dd4ed0d220ea645f3be8c3500631a9d11a6733 # main
